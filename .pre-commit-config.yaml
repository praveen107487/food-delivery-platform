repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args:
          - --fix
          - --config=backend/pyproject.toml

      - id: ruff-format
        args:
          - --config=backend/pyproject.toml

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv
        language: system
        pass_filenames: false
        args:
          - run
          - --directory
          - backend
          - mypy
          - app
